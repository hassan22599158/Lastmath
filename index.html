<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محرر الخرائط والمعادلات العربية المطور</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Amiri" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script type="text/x-mathjax-config">
        MathJax.Ajax.config.path["arabic"] = "lib/arabic-mathjax";
        MathJax.Hub.Config({
            extensions: ["[arabic]/arabic.js"],
            tex2jax: {
                inlineMath: [["$", "$"], ["\\(", "\\)"]],
                displayMath: [["$$", "$$"], ["\\[", "\\]"]],
                processEscapes: true
            },
            "HTML-CSS": {
                undefinedFamily: "Amiri",
                linebreaks: { automatic: false },
                scale: 100,
                styles: {
                    ".MathJax_Display": { "text-align": "center", "margin": "0" }
                }
            }
        });
    </script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_HTMLorMML"></script>

    <style>
        /* --- إعدادات عامة --- */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f4;
            --line-color: #bdc3c7;
        }

        * { box-sizing: border-box; }

        /* إصلاحات MathJax */
        .MathJax, .MathJax *, .MathJax_Display, .MathJax_Display * {
            box-sizing: content-box !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            line-height: normal !important;
            text-transform: none !important;
            white-space: nowrap !important;
        }
        .MathJax span, .MathJax div { border-style: solid !important; border-color: currentColor !important; }
        .MathJax { font-family: 'Amiri', serif !important; font-size: 110% !important; }
        .MathJax_Display { margin: 5px 0 !important; overflow-x: auto !important; width: 100% !important; text-align: center !important; }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: #333;
            overflow: hidden; /* يمنع ظهور شريط التمرير للصفحة بالكامل */
        }

        /* --- الهيكل الرئيسي --- */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- شريط الأدوات (تم إصلاح الاختفاء) --- */
        .toolbar {
            height: 60px;
            background: white;
            padding: 0 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0; /* هام جداً: يمنع تقلص الشريط واختفائه */
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto; /* للسماح بالتمرير في الشاشات الصغيرة */
        }

        /* تنسيق الأزرار */
        .btn {
            background: white; border: 1px solid #ddd; padding: 6px 12px;
            border-radius: 5px; cursor: pointer; font-family: 'Cairo', sans-serif;
            font-weight: 600; color: #555; display: flex; align-items: center;
            gap: 5px; font-size: 13px; height: 36px; white-space: nowrap;
        }
        .btn:hover { background: #f0f8ff; color: var(--accent-color); border-color: var(--accent-color); }
        .btn-primary { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        .btn-primary:hover { background: #2980b9; color: white; }
        .btn-info { background: #17a2b8; color: white; border-color: #17a2b8; }
        .btn-info:hover { background: #138496; color: white; }

        .zoom-controls { display: flex; gap: 5px; margin-right: auto; background: #f8f9fa; padding: 3px; border-radius: 5px; border: 1px solid #ddd; }
        .zoom-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: none; background: white; cursor: pointer; border-radius: 3px; color: #555; }
        .zoom-btn:hover { background: #e2e6ea; }

        select { padding: 0 10px; height: 36px; border-radius: 5px; border: 1px solid #ddd; font-family: 'Cairo', sans-serif; }

        /* --- منطقة العمل --- */
        .content-area {
            display: flex;
            flex: 1; /* يأخذ المساحة المتبقية */
            height: calc(100vh - 60px); /* ارتفاع مؤكد */
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        /* استجابة الشاشات */
        @media (max-width: 767px) {
            .content-area { flex-direction: column; }
            .editor-container { width: 100%; height: 35%; border-bottom: 2px solid #ddd; flex-shrink: 0; }
            .preview-wrapper { width: 100%; height: 65%; flex-grow: 1; }
        }
        @media (min-width: 768px) {
            .content-area { flex-direction: row; }
            .editor-container { width: 350px; height: 100%; border-left: 1px solid #ddd; flex-shrink: 0; }
            .preview-wrapper { flex: 1; height: 100%; }
        }

        .editor-container textarea {
            width: 100%; height: 100%; padding: 15px; border: none; resize: none;
            font-family: 'Consolas', monospace; font-size: 14px; outline: none;
            background: #fafafa; overflow-y: auto; direction: ltr; text-align: left;
        }

        .preview-wrapper {
            background: #eef1f5; overflow: hidden; position: relative;
            cursor: grab; display: flex; align-items: center; justify-content: center;
        }
        .preview-wrapper:active { cursor: grabbing; }

        .pan-zoom-container {
            transform-origin: center center; transition: transform 0.1s ease-out;
            display: inline-block; width: fit-content; height: fit-content; padding: 50px;
        }

        /* --- Tree Styles (General) --- */
        .tree { direction: ltr; text-align: center; }
        .tree ul { position: relative; margin: 0; padding: 0; }
        .tree li { list-style-type: none; position: relative; }

        /* --- Vertical Tree (Flexbox - New & Improved) --- */
        /* استخدام فليكس بوكس بدلاً من الطوفان لحل مشاكل التصدير */
        .tree:not(.horizontal) ul {
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }
        .tree:not(.horizontal) li {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 0 10px;
            position: relative;
        }
        /* خطوط الربط العمودية */
        .tree:not(.horizontal) li::before, .tree:not(.horizontal) li::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid var(--line-color); width: 50%; height: 20px; z-index: 1;
        }
        .tree:not(.horizontal) li::after { right: auto; left: 50%; border-left: 2px solid var(--line-color); }
        .tree:not(.horizontal) li:only-child::after, .tree:not(.horizontal) li:only-child::before { display: none; }
        .tree:not(.horizontal) li:only-child { padding-top: 0; }
        .tree:not(.horizontal) li:first-child::before, .tree:not(.horizontal) li:last-child::after { border: 0 none; }
        .tree:not(.horizontal) li:last-child::before { border-right: 2px solid var(--line-color); border-radius: 0 5px 0 0; }
        .tree:not(.horizontal) li:first-child::after { border-radius: 5px 0 0 0; }
        .tree:not(.horizontal) ul ul::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid var(--line-color); width: 0; height: 20px;
        }

        /* --- Horizontal Tree (RTL Support) --- */
        .tree.horizontal { direction: rtl; text-align: right; }
        .tree.horizontal ul { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-right: 20px; }
        .tree.horizontal li { display: flex; flex-direction: row; align-items: center; padding: 10px 20px 10px 0; position: relative; }
        
        .tree.horizontal li::before { content: ''; position: absolute; top: 50%; right: -20px; width: 20px; height: 2px; background: var(--line-color); }
        .tree.horizontal li::after { content: ''; position: absolute; right: -20px; top: 0; height: 100%; width: 2px; background: var(--line-color); }
        .tree.horizontal li:first-child::after { top: 50%; height: 50%; }
        .tree.horizontal li:last-child::after { height: 50%; top: 0; }
        .tree.horizontal li:only-child::after { display: none; }
        .tree.horizontal li > ul::before { content: ''; position: absolute; right: 0; top: 50%; width: 40px; height: 2px; background: var(--line-color); display: block; }
        .tree.horizontal > ul > li::before, .tree.horizontal > ul > li::after { display: none; }
        .tree.horizontal .node-card { margin-left: 20px; }

        /* --- Card Styles (تعديلات هامة للأداء والشكل) --- */
        .tree .node-card {
            background: white; border: 1px solid #ccc; border-radius: 8px;
            display: inline-block; padding: 0; color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-width: 120px;
            /* تم وضع حد أقصى للعرض لمنع الخريطة من الانفجار أفقياً */
            max-width: 350px; 
            position: relative; z-index: 2; direction: rtl; text-align: center;
        }
        
        .node-content {
            padding: 12px; width: 100%;
            white-space: normal; /* يسمح بالتفاف النص */
            word-wrap: break-word; /* يكسر الكلمات الطويلة */
            text-align: right;
        }
        .node-content img { max-width: 100%; height: auto; }
        .node-content h1, .node-content h2, .node-content h3 { color: var(--primary-color); margin-bottom: 5px; font-size: 1.1em; font-weight: bold; }
        .node-content table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.9em; display: table; }
        .node-content th, .node-content td { border: 1px solid #eee; padding: 5px; }
        .node-content th { background: #f9f9f9; }

        .level-0 .node-card { border-top: 4px solid #2980b9; }
        .level-1 .node-card { border-top: 4px solid #27ae60; }
        .level-2 .node-card { border-top: 4px solid #8e44ad; }
        .level-3 .node-card { border-top: 4px solid #e67e22; }

        .markdown-view { background: white; padding: 30px; max-width: 800px; margin: 0 auto; direction: rtl; text-align: right; box-shadow: 0 0 10px rgba(0,0,0,0.1); }

        /* --- Modal Styles --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; direction: rtl; text-align: right; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .modal-close { position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="toolbar">
        <select id="viewMode" onchange="render()">
            <option value="mindmap">عرض كخريطة</option>
            <option value="document">عرض كمستند</option>
        </select>

        <select id="layoutMode" onchange="render()">
            <option value="vertical">تخطيط عمودي</option>
            <option value="horizontal">تخطيط أفقي</option>
        </select>

        <select id="equationMode" onchange="render()">
            <option value="default">معادلات: افتراضي</option>
            <option value="arabic">معادلات: عربي</option>
            <option value="english">معادلات: إنجليزي</option>
        </select>

        <button class="btn btn-info" onclick="openUsageModal()"><i class="fas fa-info-circle"></i> طريقة الاستخدام</button>
        <button class="btn" onclick="insertFullExample()"><i class="fas fa-magic"></i> مثال</button>
        
        <button class="btn" onclick="exportToImage()"><i class="fas fa-image"></i> تصدير (PNG)</button>
        <button class="btn btn-primary" onclick="exportSmartPDF()"><i class="fas fa-file-pdf"></i> تحميل PDF</button>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomOut()" title="تصغير"><i class="fas fa-minus"></i></button>
            <button class="zoom-btn" onclick="resetZoom()" title="إعادة ضبط"><i class="fas fa-compress-arrows-alt"></i></button>
            <button class="zoom-btn" onclick="zoomIn()" title="تكبير"><i class="fas fa-plus"></i></button>
        </div>
    </div>

    <div class="content-area">
        <div class="editor-container">
            <textarea id="editor" oninput="render()" placeholder="اكتب هنا..."></textarea>
        </div>

        <div class="preview-wrapper" id="previewWrapper">
            <div class="pan-zoom-container" id="panZoomContainer">
                <div id="output"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="usageModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeUsageModal()"><i class="fas fa-times"></i></button>
        <h2>دليل الاستخدام</h2>
        <p>استخدم <code>#</code> للعناوين الرئيسية، و <code>##</code> للعناوين الفرعية.</p>
        <p>استخدم <code>$$</code> للمعادلات الرياضية.</p>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const output = document.getElementById('output');
    const viewMode = document.getElementById('viewMode');
    const layoutMode = document.getElementById('layoutMode');
    const equationMode = document.getElementById('equationMode');
    const panZoomContainer = document.getElementById('panZoomContainer');
    const previewWrapper = document.getElementById('previewWrapper');

    marked.setOptions({ breaks: true, gfm: true });

    let scale = 1;
    let panning = false;
    let pointX = 0; let pointY = 0;
    let startX = 0; let startY = 0;

    function updateTransform() {
        panZoomContainer.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    // --- Pan & Zoom Logic ---
    previewWrapper.addEventListener('mousedown', (e) => {
        if (viewMode.value !== 'mindmap') return;
        e.preventDefault();
        startX = e.clientX - pointX; startY = e.clientY - pointY;
        panning = true; previewWrapper.style.cursor = 'grabbing';
    });
    window.addEventListener('mouseup', () => { panning = false; previewWrapper.style.cursor = 'grab'; });
    previewWrapper.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        pointX = e.clientX - startX; pointY = e.clientY - startY;
        updateTransform();
    });
    previewWrapper.addEventListener('wheel', (e) => {
        if (viewMode.value === 'mindmap') {
            e.preventDefault();
            const delta = -e.deltaY;
            (delta > 0) ? (scale *= 1.1) : (scale /= 1.1);
            scale = Math.min(Math.max(0.1, scale), 5);
            updateTransform();
        }
    });

    function zoomIn() { scale *= 1.2; updateTransform(); }
    function zoomOut() { scale /= 1.2; updateTransform(); }
    function resetZoom() { scale = 1; pointX = 0; pointY = 0; updateTransform(); }

    // --- Tree Conversion Logic ---
    function convertFlatHtmlToTree(container) {
        const rootUl = document.createElement('ul');
        const stack = [{ul: rootUl, level: 0, li: null}];

        Array.from(container.children).forEach(child => {
            const tagName = child.tagName;
            const headerMatch = tagName.match(/^H(\d)$/);

            if (headerMatch) {
                const level = parseInt(headerMatch[1]);
                while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
                const parent = stack[stack.length - 1];
                const newLi = document.createElement('li');
                newLi.appendChild(child);
                parent.ul.appendChild(newLi);
                const newUl = document.createElement('ul');
                newLi.appendChild(newUl);
                stack.push({ul: newUl, level: level, li: newLi});
            } else if (tagName === 'UL' || tagName === 'OL') {
                const activeUl = stack[stack.length - 1].ul;
                while (child.firstChild) activeUl.appendChild(child.firstChild);
            } else {
                const activeContext = stack[stack.length - 1];
                if (activeContext.li) {
                    activeContext.li.insertBefore(child, activeContext.ul);
                } else {
                    const lastLi = rootUl.lastElementChild;
                    if(lastLi) {
                        const lastLiUl = lastLi.querySelector('ul');
                        lastLiUl ? lastLi.insertBefore(child, lastLiUl) : lastLi.appendChild(child);
                    }
                }
            }
        });
        return rootUl;
    }

    // --- Render Function ---
    function render() {
        let text = editor.value.replace(/^---[\s\S]+?---/, '');
        const mode = viewMode.value;
        const layout = layoutMode.value;
        const eqStyle = equationMode.value;

        const processEquation = (content) => {
            let clean = content.includes('\\alwaysar{') ? content.replace(/\\alwaysar\s*\{/g, '{') : content;
            return eqStyle === 'arabic' ? `\\alwaysar{${clean}}` : clean;
        };

        const mathBlocks = [];
        let cleanText = text.replace(/\$\$([\s\S]+?)\$\$/g, (m, c) => {
            mathBlocks.push(processEquation(c)); return `MATHBLOCK_${mathBlocks.length - 1}`;
        }).replace(/\$([^\$\n]+?)\$/g, (m, c) => {
            mathBlocks.push(processEquation(c)); return `MATHINLINE_${mathBlocks.length - 1}`;
        });

        let html = marked.parse(cleanText);

        html = html.replace(/MATHBLOCK_(\d+)/g, (m, i) => `<div class="math-scroll-container">$$${mathBlocks[i]}$$</div>`)
                   .replace(/MATHINLINE_(\d+)/g, (m, i) => `<span style="white-space: nowrap;">$${mathBlocks[i]}$</span>`);

        if (mode === 'document') {
            output.className = 'markdown-view';
            output.innerHTML = html;
            resetZoom();
            panZoomContainer.style.width = '100%';
            previewWrapper.style.cursor = 'default';
        } else {
            output.className = 'tree ' + (layout === 'horizontal' ? 'horizontal' : '');
            panZoomContainer.style.width = 'fit-content';
            previewWrapper.style.cursor = 'grab';
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            const treeRoot = convertFlatHtmlToTree(tempDiv);
            const treeContainer = document.createElement('div');
            treeContainer.appendChild(treeRoot);
            processTreeNodes(treeContainer, 0);

            output.innerHTML = '';
            treeRoot.children.length > 0 ? output.appendChild(treeRoot) : output.innerHTML = '<p style="color:#888;">ابدأ الكتابة...</p>';
        }

        if (window.MathJax) MathJax.Hub.Queue(["Typeset", MathJax.Hub, output]);
    }

    function processTreeNodes(container, level) {
        container.querySelectorAll('ul').forEach(ul => {
            if (ul.dataset.processed) return;
            ul.dataset.processed = "true";
            Array.from(ul.children).filter(c => c.tagName === 'LI').forEach(li => {
                let childUl = li.querySelector('ul');
                const card = document.createElement('div');
                card.className = 'node-card level-' + (level % 4);
                const contentDiv = document.createElement('div');
                contentDiv.className = 'node-content';
                
                li.childNodes.forEach(node => { if (node !== childUl) contentDiv.appendChild(node); });
                
                card.appendChild(contentDiv);
                li.innerHTML = ''; li.appendChild(card);
                if (childUl) { li.appendChild(childUl); processTreeNodes(childUl, level + 1); }
            });
        });
    }

    // --- Smart Image Export (Fix for Large Maps) ---
    function exportToImage() {
        const element = document.getElementById('output');
        const originalTransform = panZoomContainer.style.transform;
        
        // إعادة تعيين التحويل مؤقتاً للتصوير
        panZoomContainer.style.transform = 'none';
        panZoomContainer.style.width = 'fit-content';

        setTimeout(() => {
            const width = element.scrollWidth;
            const height = element.scrollHeight;
            
            // معادلة ذكية لتحديد الدقة بناء على الحجم
            // إذا كانت الخريطة عملاقة (أكبر من 6 مليون بكسل مربع)، نستخدم دقة عادية لتجنب الانهيار
            let smartScale = 2;
            if (width * height > 6000000) smartScale = 1; 
            else if (width * height < 1000000) smartScale = 3;

            console.log(`Export Size: ${width}x${height}, Scale: ${smartScale}`);

            html2canvas(element, {
                scale: smartScale,
                backgroundColor: "#ffffff",
                useCORS: true,
                width: width + 50, // إضافة هامش للأمان
                height: height + 50,
                x: -25,
                y: -25
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'mindmap.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                panZoomContainer.style.transform = originalTransform;
            }).catch(err => {
                console.error(err);
                alert("الخريطة كبيرة جداً! حاول استخدام العرض الأفقي أو تقليل المحتوى.");
                panZoomContainer.style.transform = originalTransform;
            });
        }, 100);
    }

    function exportSmartPDF() {
        const element = document.getElementById('output');
        const originalTransform = panZoomContainer.style.transform;
        panZoomContainer.style.transform = 'none';
        panZoomContainer.style.width = 'fit-content';

        setTimeout(() => {
            const trueWidth = element.scrollWidth + 60;
            const trueHeight = element.scrollHeight + 60;
            const opt = {
                margin: 10, filename: 'mindmap.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 1.5, useCORS: true, width: trueWidth, height: trueHeight }, // تقليل الدقة قليلاً للـ PDF
                jsPDF: { unit: 'px', format: [trueWidth, trueHeight], orientation: trueWidth > trueHeight ? 'landscape' : 'portrait' }
            };
            html2pdf().set(opt).from(element).save().then(() => panZoomContainer.style.transform = originalTransform);
        }, 100);
    }

    function insertFullExample() {
        editor.value = "# عنوان رئيسي\n## فرع 1\nمحتوى الفرع\n## فرع 2\nمحتوى آخر";
        render();
    }
    
    function openUsageModal() { document.getElementById('usageModal').classList.add('active'); }
    function closeUsageModal() { document.getElementById('usageModal').classList.remove('active'); }

    window.onload = function() { insertFullExample(); };
</script>

</body>
</html>
