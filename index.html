<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محرر الخرائط والمعادلات العربية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Amiri" rel="stylesheet" type="text/css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script type="text/x-mathjax-config">
        MathJax.Ajax.config.path["arabic"] = "lib/arabic-mathjax";
        MathJax.Hub.Config({
            extensions: ["[arabic]/arabic.js"],
            tex2jax: {
                inlineMath: [["$", "$"], ["\\(", "\\)"]],
                displayMath: [["$$", "$$"], ["\\[", "\\]"]],
                processEscapes: true
            },
            "HTML-CSS": {
                undefinedFamily: "Amiri",
                linebreaks: { automatic: false },
                scale: 100,
                styles: {
                    ".MathJax_Display": {
                        "text-align": "center",
                        "margin": "0"
                    }
                }
            }
        });
    </script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_HTMLorMML"></script>

    <style>
        /* --- إعدادات عامة --- */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f4;
            --line-color: #bdc3c7;
        }

        * { box-sizing: border-box; }

        .MathJax, .MathJax *, .MathJax_Display, .MathJax_Display * {
            box-sizing: content-box !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            cell-spacing: 0 !important;
            line-height: normal !important;
            text-transform: none !important;
            white-space: nowrap !important;
        }

        .MathJax span, .MathJax div {
            border-style: solid !important;
            border-color: currentColor !important;
        }

        .MathJax {
            font-family: 'Amiri', serif !important;
            font-size: 110% !important;
        }

        .MathJax_Display {
            margin: 5px 0 !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            padding: 8px 0 !important;
            width: 100% !important;
            text-align: center !important;
            display: block !important;
        }

        body, html {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: #333;
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        .toolbar {
            height: 60px;
            background: white;
            padding: 0 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto;
            white-space: nowrap;
        }

        .toolbar::-webkit-scrollbar {
            height: 4px;
        }
        .toolbar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 2px;
        }

        .btn {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            color: #555;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            height: 36px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn:hover { background: #f0f8ff; color: var(--accent-color); border-color: var(--accent-color); }
        .btn-primary { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        .btn-primary:hover { background: #2980b9; color: white; }
        .btn-info { background: #17a2b8; color: white; border-color: #17a2b8; }
        .btn-info:hover { background: #138496; color: white; }
        .btn-warning { background: #f39c12; color: white; border-color: #f39c12; }
        .btn-warning:hover { background: #d68910; color: white; }
        
        .btn-toggle.active {
            background-color: #27ae60;
            color: white;
            border-color: #27ae60;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .zoom-controls {
            display: flex;
            gap: 5px;
            margin-right: auto;
            background: #f8f9fa;
            padding: 3px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .zoom-btn {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: white;
            cursor: pointer;
            border-radius: 3px;
            color: #555;
        }
        .zoom-btn:hover { background: #e2e6ea; }

        select {
            padding: 0 10px;
            height: 36px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-family: 'Cairo', sans-serif;
        }

        .content-area {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        @media (max-width: 767px) {
            .content-area { flex-direction: column; }
            .editor-container {
                width: 100%;
                height: 35%;
                border-bottom: 2px solid #ddd;
                flex-shrink: 0;
            }
            .preview-wrapper {
                width: 100%;
                height: 65%;
                flex-grow: 1;
            }
        }

        @media (min-width: 768px) {
            .content-area { flex-direction: row; }
            .editor-container {
                width: 350px;
                height: 100%;
                border-left: 1px solid #ddd;
                flex-shrink: 0;
            }
            .preview-wrapper {
                flex: 1;
                height: 100%;
            }
        }

        .editor-container {
            background: #fff;
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
        }
        .editor-container textarea {
            width: 100%;
            height: 100%;
            padding: 15px;
            border: none;
            resize: none;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
        }

        .preview-wrapper {
            background: #eef1f5;
            overflow: hidden;
            position: relative;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .preview-wrapper.pan-active {
            cursor: grab;
        }
        .preview-wrapper.pan-active:active {
            cursor: grabbing;
        }

        .pan-zoom-container {
            transform-origin: 0 0;
            display: inline-block;
            width: fit-content;
            height: fit-content;
            padding: 50px;
            will-change: transform;
        }

        /* --- Tree Base Styles --- */
        .tree { direction: ltr; text-align: center; }
        .tree ul {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 0; padding: 0;
        }
        .tree li {
            list-style-type: none;
            position: relative;
        }

        /* Vertical Tree */
        .tree:not(.horizontal) ul { padding-top: 20px; }
        .tree:not(.horizontal) li { float: left; text-align: center; padding: 20px 10px 0 10px; }
        .tree:not(.horizontal) li::before, .tree:not(.horizontal) li::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid var(--line-color); width: 50%; height: 20px; z-index: 1;
        }
        .tree:not(.horizontal) li::after { right: auto; left: 50%; border-left: 2px solid var(--line-color); }
        .tree:not(.horizontal) li:only-child::after, .tree:not(.horizontal) li:only-child::before { display: none; }
        .tree:not(.horizontal) li:only-child { padding-top: 0; }
        .tree:not(.horizontal) li:first-child::before, .tree:not(.horizontal) li:last-child::after { border: 0 none; }
        .tree:not(.horizontal) li:last-child::before { border-right: 2px solid var(--line-color); border-radius: 0 5px 0 0; }
        .tree:not(.horizontal) li:first-child::after { border-radius: 5px 0 0 0; }
        .tree:not(.horizontal) ul ul::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid var(--line-color); width: 0; height: 20px;
        }

        /* Horizontal Tree */
        .tree.horizontal { direction: rtl; text-align: right; }
        .tree.horizontal ul { flex-direction: column; padding-right: 20px; justify-content: center; align-items: flex-start; }
        .tree.horizontal li { display: flex; flex-direction: row; align-items: center; padding: 10px 20px 10px 0; position: relative; }
        .tree.horizontal li::after { content: ''; position: absolute; right: -20px; top: 0; height: 100%; width: 2px; background: var(--line-color); }
        .tree.horizontal > ul > li::after { display: none; }
        .tree.horizontal li:first-child::after { top: 50%; height: 50%; }
        .tree.horizontal li:last-child::after { height: 50%; top: 0; }
        .tree.horizontal li:only-child::after { display: none; }
        .tree.horizontal li::before { content: ''; position: absolute; top: 50%; right: -20px; width: 20px; height: 2px; background: var(--line-color); }
        .tree.horizontal > ul > li::before { display: none; }
        .tree.horizontal .node-card { position: relative; z-index: 2; margin-left: 20px; }
        .tree.horizontal li:has(> ul) > .node-card::after { content: ''; position: absolute; top: 50%; left: -20px; width: 20px; height: 2px; background: var(--line-color); }
        .tree.horizontal li > ul::before { display: block; top: 50%; content: ''; position: absolute; right: 0; width: 40px; height: 2px; background: var(--line-color); }
        .tree.horizontal ul { padding-right: 40px; position: relative; }
        .tree.horizontal > ul { padding-right: 0; }
        .tree.horizontal .node-content { min-width: 120px; }

        .tree .node-card {
            background: white; border: 1px solid #ccc; border-radius: 8px; display: inline-block;
            padding: 0; color: #333; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-width: 180px;
            max-width: none; position: relative; z-index: 2; direction: rtl; text-align: center; vertical-align: top;
        }
        .node-content { padding: 12px; width: 100%; max-height: none; overflow: visible; text-align: right; }
        .node-content img { max-width: 100%; height: auto; }
        .node-content h1, .node-content h2, .node-content h3 { color: var(--primary-color); margin-bottom: 5px; font-size: 1.1em; font-weight: bold; }
        .node-content table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.9em; display: table; }
        .node-content th, .node-content td { border: 1px solid #eee; padding: 5px; }
        .node-content th { background: #f9f9f9; }
        
        .level-0 .node-card { border-top: 4px solid #2980b9; }
        .level-1 .node-card { border-top: 4px solid #27ae60; }
        .level-2 .node-card { border-top: 4px solid #8e44ad; }
        .level-3 .node-card { border-top: 4px solid #e67e22; }

        .markdown-view {
            background: white; padding: 30px; max-width: 800px; margin: 0 auto;
            direction: rtl; text-align: right; box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* --- Modal Styles --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 600px;
            max-height: 90vh; overflow-y: auto; direction: rtl; text-align: right; position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .modal-close {
            position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 20px; cursor: pointer; color: #999;
        }
        .modal-close:hover { color: #333; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="toolbar">
        <button id="togglePanBtn" class="btn btn-toggle" onclick="togglePanMode()">
            <i class="fas fa-hand-paper"></i> وضع التحريك
        </button>

        <select id="viewMode" onchange="render()">
            <option value="mindmap">عرض كخريطة</option>
            <option value="document">عرض كمستند</option>
        </select>

        <select id="layoutMode" onchange="render()">
            <option value="vertical">تخطيط عمودي</option>
            <option value="horizontal">تخطيط أفقي</option>
        </select>

        <select id="equationMode" onchange="render()">
            <option value="default">معادلات: افتراضي</option>
            <option value="arabic">معادلات: عربي</option>
            <option value="english">معادلات: إنجليزي</option>
        </select>

        <button class="btn btn-info" onclick="openUsageModal()">
            <i class="fas fa-info-circle"></i> التعليمات
        </button>

        <button class="btn btn-warning" onclick="updateLibrary()">
            <i class="fas fa-sync-alt"></i> تحديث المكتبة
        </button>

        <button class="btn" onclick="insertFullExample()">
            <i class="fas fa-magic"></i> مثال
        </button>

        <button class="btn" onclick="exportToImage(3)">
            <i class="fas fa-image"></i> تصدير (دقة عالية)
        </button>

        <button class="btn" onclick="exportHugeMap()">
            <i class="fas fa-expand"></i> تصدير خريطة ضخمة
        </button>

        <input type="file" id="importHtmlInput" accept=".html" style="display: none;" onchange="handleHtmlImport(event)">
        <button class="btn btn-info" onclick="document.getElementById('importHtmlInput').click()">
            <i class="fas fa-file-import"></i> استخراج النص
        </button>

        <button class="btn" onclick="exportToHtml()">
            <i class="fas fa-code"></i> حفظ كـ HTML
        </button>

        <button class="btn btn-primary" onclick="exportSmartPDF()">
            <i class="fas fa-file-pdf"></i> PDF
        </button>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomOut()" title="تصغير"><i class="fas fa-minus"></i></button>
            <button class="zoom-btn" onclick="resetZoom()" title="إعادة ضبط"><i class="fas fa-compress-arrows-alt"></i></button>
            <button class="zoom-btn" onclick="zoomIn()" title="تكبير"><i class="fas fa-plus"></i></button>
        </div>
    </div>

    <div class="content-area">
        <div class="editor-container">
            <textarea id="editor" oninput="render()" placeholder="اكتب هنا..."></textarea>
        </div>

        <div class="preview-wrapper" id="previewWrapper">
            <div class="pan-zoom-container" id="panZoomContainer">
                <div id="output"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="usageModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeUsageModal()"><i class="fas fa-times"></i></button>
        <h2>دليل استخدام Markdown</h2>
        <p>يدعم المحرر تنسيق Markdown القياسي لإنشاء الخرائط الذهنية.</p>
        <h3>1. الهيكلية (Nodes):</h3>
        <ul>
            <li><code># عنوان رئيسي</code>: عقدة المستوى الأول.</li>
            <li><code>## عنوان فرعي</code>: عقدة فرعية.</li>
        </ul>
        <h3>2. المعادلات:</h3>
        <ul>
            <li>استخدم <code>$$ معادلة $$</code>.</li>
        </ul>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const output = document.getElementById('output');
    const viewMode = document.getElementById('viewMode');
    const layoutMode = document.getElementById('layoutMode');
    const equationMode = document.getElementById('equationMode');
    const panZoomContainer = document.getElementById('panZoomContainer');
    const previewWrapper = document.getElementById('previewWrapper');
    const togglePanBtn = document.getElementById('togglePanBtn');

    marked.setOptions({ breaks: true, gfm: true });

    // --- State Variables ---
    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let isPanModeEnabled = false; 
    let evCache = [];
    let prevDiff = -1;

    function togglePanMode() {
        isPanModeEnabled = !isPanModeEnabled;
        if(isPanModeEnabled) {
            togglePanBtn.classList.add('active');
            previewWrapper.classList.add('pan-active');
        } else {
            togglePanBtn.classList.remove('active');
            previewWrapper.classList.remove('pan-active');
        }
    }

    function updateTransform() {
        panZoomContainer.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    // --- Panning & Zooming Logic (Same as before) ---
    previewWrapper.addEventListener('mousedown', (e) => {
        if (!isPanModeEnabled || viewMode.value !== 'mindmap') return;
        if (e.button !== 0) return; 
        e.preventDefault();
        startX = e.clientX - pointX;
        startY = e.clientY - pointY;
        isPanning = true;
        previewWrapper.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        if(isPanning) {
            isPanning = false;
            previewWrapper.style.cursor = isPanModeEnabled ? 'grab' : 'default';
        }
    });

    previewWrapper.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        pointX = e.clientX - startX;
        pointY = e.clientY - startY;
        updateTransform();
    });

    previewWrapper.addEventListener('pointerdown', (ev) => {
        if (!isPanModeEnabled || viewMode.value !== 'mindmap') return;
        evCache.push(ev);
        if (evCache.length === 1) {
            startX = ev.clientX - pointX;
            startY = ev.clientY - pointY;
            isPanning = true;
        }
    });

    previewWrapper.addEventListener('pointermove', (ev) => {
        if (!isPanModeEnabled || viewMode.value !== 'mindmap') return;
        const index = evCache.findIndex((cachedEv) => cachedEv.pointerId === ev.pointerId);
        if (index > -1) evCache[index] = ev;
        if (evCache.length === 2) {
            isPanning = false; 
            const curDiff = Math.hypot(evCache[0].clientX - evCache[1].clientX, evCache[0].clientY - evCache[1].clientY);
            const midX = (evCache[0].clientX + evCache[1].clientX) / 2;
            const midY = (evCache[0].clientY + evCache[1].clientY) / 2;
            if (prevDiff > 0) {
                const newScale = scale * (curDiff / prevDiff);
                if (newScale >= 0.1 && newScale <= 5) {
                    const worldMidX = (midX - pointX) / scale;
                    const worldMidY = (midY - pointY) / scale;
                    scale = newScale;
                    pointX = midX - worldMidX * scale;
                    pointY = midY - worldMidY * scale;
                    updateTransform();
                }
            }
            prevDiff = curDiff;
        } else if (evCache.length === 1 && isPanning) {
            ev.preventDefault();
            pointX = ev.clientX - startX;
            pointY = ev.clientY - startY;
            updateTransform();
        }
    });

    function removeEvent(ev) {
        const index = evCache.findIndex((cachedEv) => cachedEv.pointerId === ev.pointerId);
        if (index > -1) evCache.splice(index, 1);
    }
    previewWrapper.addEventListener('pointerup', (ev) => {
        removeEvent(ev);
        if (evCache.length < 2) prevDiff = -1;
        if (evCache.length === 0) isPanning = false;
        if (evCache.length === 1) {
            startX = evCache[0].clientX - pointX;
            startY = evCache[0].clientY - pointY;
            isPanning = true;
        }
    });
    previewWrapper.addEventListener('pointercancel', (ev) => { removeEvent(ev); if (evCache.length < 2) prevDiff = -1; isPanning = false; });
    previewWrapper.addEventListener('wheel', (e) => {
        if (viewMode.value !== 'mindmap' || !isPanModeEnabled) return;
        e.preventDefault();
        const newScale = scale * Math.exp(-e.deltaY * 0.001);
        if (newScale >= 0.1 && newScale <= 5) {
            const mouseX = e.clientX; const mouseY = e.clientY;
            const worldMouseX = (mouseX - pointX) / scale;
            const worldMouseY = (mouseY - pointY) / scale;
            scale = newScale;
            pointX = mouseX - worldMouseX * scale;
            pointY = mouseY - worldMouseY * scale;
            updateTransform();
        }
    }, { passive: false });

    function zoomIn() { 
        const wrapperRect = previewWrapper.getBoundingClientRect();
        const centerX = wrapperRect.width / 2 + wrapperRect.left;
        const centerY = wrapperRect.height / 2 + wrapperRect.top;
        const worldCenterX = (centerX - pointX) / scale;
        const worldCenterY = (centerY - pointY) / scale;
        scale *= 1.2; 
        pointX = centerX - worldCenterX * scale;
        pointY = centerY - worldCenterY * scale;
        updateTransform(); 
    }
    function zoomOut() { 
        const wrapperRect = previewWrapper.getBoundingClientRect();
        const centerX = wrapperRect.width / 2 + wrapperRect.left;
        const centerY = wrapperRect.height / 2 + wrapperRect.top;
        const worldCenterX = (centerX - pointX) / scale;
        const worldCenterY = (centerY - pointY) / scale;
        scale /= 1.2; 
        pointX = centerX - worldCenterX * scale;
        pointY = centerY - worldCenterY * scale;
        updateTransform(); 
    }
    function resetZoom() { 
        scale = 1; pointX = 0; pointY = 0; 
        const wrapperRect = previewWrapper.getBoundingClientRect();
        if(wrapperRect.width > 0) { pointX = wrapperRect.width / 2 - 100; pointY = 50; }
        updateTransform(); 
    }

    // --- HTML to Tree Logic ---
    function convertFlatHtmlToTree(container) {
        const rootUl = document.createElement('ul');
        const stack = [{ul: rootUl, level: 0, li: null}];

        Array.from(container.children).forEach(child => {
            const tagName = child.tagName;
            const headerMatch = tagName.match(/^H(\d)$/);

            if (headerMatch) {
                const level = parseInt(headerMatch[1]);
                while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
                const parent = stack[stack.length - 1];
                const newLi = document.createElement('li');
                newLi.appendChild(child);
                parent.ul.appendChild(newLi);
                const newUl = document.createElement('ul');
                newLi.appendChild(newUl);
                stack.push({ul: newUl, level: level, li: newLi});

            } else if (tagName === 'UL' || tagName === 'OL') {
                const activeUl = stack[stack.length - 1].ul;
                while (child.firstChild) activeUl.appendChild(child.firstChild);
            } else {
                const activeContext = stack[stack.length - 1];
                if (activeContext.li) activeContext.li.insertBefore(child, activeContext.ul);
                else {
                    if (rootUl.children.length === 0 || rootUl.lastElementChild.querySelector('h1,h2,h3,h4,h5,h6')) {
                        const li = document.createElement('li'); rootUl.appendChild(li); const newUl = document.createElement('ul'); li.appendChild(newUl);
                    }
                    const lastLi = rootUl.lastElementChild;
                    const lastLiUl = lastLi.querySelector('ul');
                    if (lastLiUl) lastLi.insertBefore(child, lastLiUl); else lastLi.appendChild(child);
                }
            }
        });
        return rootUl;
    }

    function processTreeNodes(container, level) {
        const uls = container.querySelectorAll('ul');
        uls.forEach(ul => {
            if (ul.dataset.processed) return;
            ul.dataset.processed = "true";
            Array.from(ul.children).filter(c => c.tagName === 'LI').forEach(li => {
                let childUl = li.querySelector('ul');
                const card = document.createElement('div');
                card.className = 'node-card level-' + (level % 4);
                const contentDiv = document.createElement('div');
                contentDiv.className = 'node-content';
                const nodesToMove = [];
                li.childNodes.forEach(node => { if (node !== childUl) nodesToMove.push(node); });
                nodesToMove.forEach(node => contentDiv.appendChild(node));
                card.appendChild(contentDiv);
                li.innerHTML = ''; 
                li.appendChild(card);
                if (childUl) { li.appendChild(childUl); processTreeNodes(childUl, level + 1); }
            });
        });
    }

    // --- Render Function (View Only) ---
    function render() {
        let text = editor.value;
        const mode = viewMode.value;
        const layout = layoutMode.value;
        const eqStyle = equationMode.value;

        text = text.replace(/^---[\s\S]+?---/, '');

        const processEquation = (mathContent) => {
            if (eqStyle === 'default') return mathContent;
            let clean = mathContent;
            if (clean.includes('\\alwaysar{')) clean = clean.replace(/\\alwaysar\s*\{/g, '{');
            if (eqStyle === 'english') return clean;
            if (eqStyle === 'arabic') return `\\alwaysar{${clean}}`;
            return mathContent;
        };

        const mathBlocks = [];
        let cleanText = text.replace(/\$\$([\s\S]+?)\$\$/g, (m, content) => {
            mathBlocks.push(processEquation(content));
            return `MATHBLOCK_${mathBlocks.length - 1}`;
        }).replace(/\$([^\$\n]+?)\$/g, (m, content) => {
            mathBlocks.push(processEquation(content));
            return `MATHINLINE_${mathBlocks.length - 1}`;
        });

        let html = marked.parse(cleanText);
        html = html.replace(/MATHBLOCK_(\d+)/g, (m, i) => `<div class="math-scroll-container">$$${mathBlocks[i]}$$</div>`)
                   .replace(/MATHINLINE_(\d+)/g, (m, i) => `<span style="white-space: nowrap;">$${mathBlocks[i]}$</span>`);

        if (mode === 'document') {
            output.className = 'markdown-view';
            output.innerHTML = html;
            resetZoom();
            panZoomContainer.style.width = '100%';
            previewWrapper.style.cursor = 'default';
        } else {
            output.className = 'tree ' + (layout === 'horizontal' ? 'horizontal' : '');
            panZoomContainer.style.width = 'fit-content';
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            const treeRoot = convertFlatHtmlToTree(tempDiv);
            const treeContainer = document.createElement('div');
            treeContainer.appendChild(treeRoot);
            processTreeNodes(treeContainer, 0);
            output.innerHTML = '';
            if (treeRoot.children.length > 0) output.appendChild(treeRoot);
            else output.innerHTML = '<p style="color:#888;">ابدأ بكتابة عنوان (#) أو قائمة (-)</p>';
        }

        if (window.MathJax) MathJax.Hub.Queue(["Typeset", MathJax.Hub, output]);
    }

                // فك التشفير واستخراج الكود المصدري الأصلي كما تمت كتابته بالضبط
                extractedText = decodeUnicodeBase64(dataScript.textContent.trim());
            } else {
                alert("هذا الملف قديم ولا يحتوي على كود Markdown المصدري المخبأ بداخله.");

                return;

                if (userWantsDownload) {

title: الهندسة الفراغية (الجزء 1: النظام الإحداثي ثلاثي الأبعاد والمتجهات)
---

# 1. القصة من البداية (من 1D لـ 3D) 🌐

يا هندسة، الحكاية بدأت بالتطور الطبيعي:
1.  **بعد واحد (1D):** طول بس (غير موجود في الواقع).
2.  **بعدين (2D):** طول وعرض (محاور س، ص). دي الشبكة الترببعية القديمة.
3.  **ثلاثة أبعاد (3D):** طول وعرض وارتفاع (س، ص، ع). ده النظام اللي يوصف الواقع (مكعب، هرم، غرفة).

## شكل المحاور (قاعدة اليد اليمنى)
النظام بيتكون من 3 محاور متعامدة (س، ص، ع) بيتلاقوا في "نقطة الأصل" $(0,0,0)$.
* الشكل اللي بنرسمه على الورق ده "نموذج محاكي" مش حقيقي، لأن الورقة 2D أصلاً.
* **تخيل:** بص في ركن الأوضة بتاعتك:
    * الأرضية هي المستوى (س ص).
    * الحيطة اليمين (ص ع).
    * الحيطة اللي في وشك (س ع).

---

# 2. اللعب مع المحاور والمستويات (معادلات وإحداثيات) 📍

عشان نلعب صح، لازم نفرق بين "المحور" و "المستوى".

## أ) المحاور (Lines)
المحور هو خط مستقيم. أي نقطة عليه بيكون ليها إحداثي واحد والباقي أصفار.

| المحور | شكل النقطة عليه | معادلة المحور (الزتونة) |
| :--- | :--- | :--- |
| **محور س** | $(x, 0, 0)$ | $$y=0, z=0$$ (لازم الاتنين بصفر) |
| **محور ص** | $(0, y, 0)$ | $$x=0, z=0$$ |
| **محور ع** | $(0, 0, z)$ | $$x=0, y=0$$ |

## ب) المستويات (Planes) المستوى هو "سطح" (زي الأرض أو الحيطة).

| المستوى | شكل النقطة فيه | معادلة المستوى (صفر المختلف) |
| :--- | :--- | :--- |
| **المستوى (س ص)** | $(x, y, 0)$ | $$z=0$$ |
| **المستوى (س ع)** | $(x, 0, z)$ | $$y=0$$ |
| **المستوى (ص ع)** | $(0, y, z)$ | $$x=0$$ |

> 💡 **فلسفة الإحداثيات:**
> الزوج المرتب $(س، ص، ع)$ هو "أمر بالحركة". لما أقولك $(2, 3, 4)$ معناه:
> ابدأ من نقطة الأصل $\\to$ امشي 2 على س $\\to$ امشي 3 على ص $\\to$ اطلع 4 على ع.

---

# 3. قوانين البعد (Distance) 📏

هنا بقى الشغل العالي. البعد يعني "مسافة"، والمسافة دايماً موجبة.

## أولاً: بعد نقطة عن "حاجة"

**1. بعد نقطة عن (مستوى):**
بناخد **مقياس الرمز الناقص** (المختلف).
* بعد النقطة $(x, y, z)$ عن المستوى **(س ص)**:
    $$\\text{البعد} = |z|$$
    *(ليه مقياس؟ عشان مفيش طول بالسالب)*.

**2. بعد نقطة عن (محور):**
بناخد **جذر مجموع مربعات الباقيين**. (نظرية فيثاغورس).
* بعد النقطة $(x, y, z)$ عن محور **س**:
    $$\\text{البعد} = \\sqrt{y^2 + z^2}$$.
    *(تخيلها وتر في مثلث قائم)*.

**3. بعد نقطة عن (نقطة الأصل):**
$$\\text{البعد} = \\sqrt{x^2 + y^2 + z^2}$$

---

## ثانياً: البعد بين نقطتين (قانون الجذور)
لو عندي نقطة $A(x_1, y_1, z_1)$ ونقطة $B(x_2, y_2, z_2)$.
طول القطعة المستقيمة $AB$:

$$
\\text{الطول} = \\sqrt{\\underbrace{(x_2 - x_1)^2}_{\\text{فرق السينات}} + \\underbrace{(y_2 - y_1)^2}_{\\text{فرق الصادات}} + \\underbrace{(z_2 - z_1)^2}_{\\text{فرق العينات}}}
$$

### 🔥 تطبيقات قانون البعد (إثبات الأشكال الهندسية)
1.  **استقامة واحدة:** لو $AB + BC = AC$ (مجموع الصغيرين قد الكبير).
2.  **نوع المثلث (بالنسبة للأضلاع):** متساوي الأضلاع، متساوي الساقين، مختلف.
3.  **نوع المثلث (بالنسبة للزوايا):** ربع الأضلاع وقارن:
    * لو $c^2 = a^2 + b^2$ $\\to$ **قائم**.
    * لو $c^2 > a^2 + b^2$ $\\to$ **منفرج**.
    * لو $c^2 < a^2 + b^2$ $\\to$ **حاد**.
4.  **الأشكال الرباعية:**
    * أضلاع متساوية + أقطار متساوية $\\to$ **مربع**.
    * أضلاع متساوية + أقطار غير متساوية $\\to$ **معين**.
    * كل ضلعين متقابلين متساويين + أقطار متساوية $\\to$ **مستطيل**.

---

# 4. المسقط والصورة (Masqat & Reflection) 🪞

دي "اللخبطة" كلها، ركز في التريكة:

## أ) المسقط (Projection) - "التصفير"
المسقط يعني "ظل" النقطة. بتنزل عمود وتشوف لمست فين.
* **القاعدة:** صفر اللي مش موجود في الاسم.
* مسقط $(x, y, z)$ على محور **س** $\\to$ صفر الباقي $\\to$ $(x, 0, 0)$.
* مسقط $(x, y, z)$ على المستوى **(س ص)** $\\to$ صفر الباقي $\\to$ $(x, y, 0)$.

## ب) الصورة بالانعكاس (Reflection) - "تغيير الإشارة"
الانعكاس يعني النقطة بتبص في المراية.
* **القاعدة:** غير إشارة اللي مش موجود في الاسم (المختلف).
* صورة $(x, y, z)$ بالانعكاس في محور **س** $\\to$ ثبت س وغير الباقي $\\to$ $(x, -y, -z)$.
* صورة $(x, y, z)$ بالانعكاس في المستوى **(س ص)** $\\to$ ثبت س,ص وغير الباقي $\\to$ $(x, y, -z)$.
* صورة النقطة بالانعكاس في **نقطة الأصل** $\\to$ غير كله $\\to$ $(-x, -y, -z)$.

> 💡 **ملحوظة فنية:** الصورة بالانعكاس هي نفسها "الدوران بزاوية 180 درجة" حول المحور أو النقطة.

---

# 5. المتجهات (Vectors) - اللعبة الجديدة ↗️

في فرق جوهري بين "النقطة" و "المتجه":
* **النقطة:** مكان ثابت (لوكيشن).
* **المتجه:** قطعة مستقيمة موجهة (أمر بالحركة من.. إلى..).

## أنواع المتجهات:
1.  **متجه الموضع (Position Vector):**
    * بدايته دايماً "نقطة الأصل" ($W$).
    * يُكتب بحرف واحد ($\\vec{A}$).
    * مركباته هي نفسها إحداثيات النقطة أ..
2.  **متجه عادي (Displacement Vector):**
    * بدايته أي نقطة ونهايته أي نقطة ($\\vec{AB}$).
    * **القانون الذهبي:**
        $$\\vec{AB} = \\text{النهاية} - \\text{البداية} = \\vec{B} - \\vec{A}$$.

## صور كتابة المتجه:
1.  **الصورة الإحداثية:** $\\vec{A} = (2, -3, 5)$.
2.  **الصورة الجبرية (متجهات الوحدة):** $\\vec{A} = 2\\vec{i} - 3\\vec{j} + 5\\vec{k}$ (حيث $\\vec{i}, \\vec{j}, \\vec{k}$ هي متجهات الوحدة الأساسية في اتجاه س، ص، ع).

## معيار المتجه (Norm/Magnitude)
هو "طول" القطعة المستقيمة الممثلة للمتجه.
$$
||\\vec{A}|| = \\sqrt{x^2 + y^2 + z^2}
$$

> 🛑 **تريكة:** معيار المتجه $\\vec{AB}$ هو هو معيار المتجه $\\vec{BA}$، وهو هو طول القطعة المستقيمة $AB$. الطول مافيهوش سالب.

---

# الجدول الذهبي (ملخص الفراغية - الجزء 1) 🌟

| المطلوب | القانون / الطريقة | تريكة Wak |
| :--- | :--- | :--- |
| **بعد نقطة عن مستوى (س ص)** | $$|z|$$ (مقياس ع) | خد الرمز الناقص وحطه في مقياس. |
| **بعد نقطة عن محور (س)** | $$\\sqrt{y^2 + z^2}$$ | خد جذر تربيع الباقيين. |
| **مسقط نقطة على (س ص)** | $$(x, y, 0)$$ | **صفر** الرمز الناقص. |
| **صورة بانعكاس في (س ص)** | $$(x, y, -z)$$ | **غير إشارة** الرمز الناقص. |
| **صورة بانعكاس في (س)** | $$(x, -y, -z)$$ | ثبت (س) وغير إشارة الاتنين التانيين. |
| **المتجه $\\vec{AB}$** | $$\\vec{B} - \\vec{A}$$ | النهاية ناقص البداية. |
| **معيار المتجه $\\vec{A}$** | $$\\sqrt{x^2 + y^2 + z^2}$$ | فيثاغورس في الفراغ. |

تم الانتهاء من (الجزء 1).
جاهز للجزء التاني يا هندسة؟ 🚀

title: الهندسة الفراغية (الجزء 2: أسرار المتجهات وزوايا الاتجاه)
---

# 1. خواص المعيار (طول المتجه) 📏

المعيار هو طول، والطول ليه احترام:
1.  **دايماً موجب:** مفيش طول بالسالب. (أقل قيمة صفر لو المتجه صفري).
2.  **خروج الأرقام (المقياس):**
    لو عندك رقم جوه المعيار، يطلع بره بـ "قيمة مطلقة" (مقياس).
    $$
    ||-5 \\vec{A}|| = |-5| \\times ||\\vec{A}|| = 5 ||\\vec{A}||
    $$
    *(خد بالك: لو رمز مجهول $k$ جوه المعيار، يطلع $|k|$).*

3.  **متباينة المثلث (التوزيع الممنوع):** 🛑
    المعيار **لا يوزع** على الجمع والطرح.
    $$||\\vec{A} + \\vec{B}|| \\leq ||\\vec{A}|| + ||\\vec{B}||$$
    * امتى نحط "يساوي"؟ حالة واحدة بس: لو المتجهين **متوازيين ولهم نفس الاتجاه**.

---

# 2. متجه الوحدة (Unit Vector) ☝️

هو أي متجه معياره (طوله) يساوي **1**.

## أ) متجه الوحدة في اتجاه معلوم (القانون):
عشان تجيب متجه طوله 1 وماشي في نفس اتجاه المتجه $\\vec{A}$، بنقسم المتجه على معياره.

$$
\\vec{U}_A = \\frac{\\vec{A}}{||\\vec{A}||}
$$

$$
\\text{متجه الوحدة} = \\frac{\\text{المتجه الأصلي}}{\\text{معياره}}
$$

## ب) أهمية متجه الوحدة (التصنيع):
لو معاك "معيار" (قوة مثلاً 100 نيوتن) وعايز تحولها لمتجه، تضرب المعيار في متجه الوحدة بتاع الاتجاه اللي هي ماشية فيه.
$$
\\vec{F} = ||\\vec{F}|| \\times \\vec{U}_{\\text{اتجاه}}
$$

---

# 3. زوايا الاتجاه وجيوب التمام (Direction Cosines) 🧭

المتجه في الفراغ بيعمل 3 زوايا مع الاتجاهات **الموجبة** للمحاور:
* $\\theta_x$: الزاوية مع محور س الموجب.
* $\\theta_y$: الزاوية مع محور ص الموجب.
* $\\theta_z$: الزاوية مع محور ع الموجب.

## أ) العلاقة السحرية (مفتاح اللغز):
جيوب تمام الزوايا دي (Jata) هي نفسها مركبات **متجه الوحدة**.
يعني:
$$
\\vec{U}_A = (\\cos \\theta_x, \\cos \\theta_y, \\cos \\theta_z)
$$

وبما إن معيار متجه الوحدة = 1، يبقى القانون الأخطر في الدرس:

$$
\\cos^2 \\theta_x + \\cos^2 \\theta_y + \\cos^2 \\theta_z = 1
$$

### 🧠 تريكات Wak في الزوايا:
1.  **مجموع الجا (Sin):**
    بما إن $\\cos^2 = 1 - \\sin^2$، لو عوضت في القانون اللي فوق هيطلعلك:
    $$
    \\sin^2 \\theta_x + \\sin^2 \\theta_y + \\sin^2 \\theta_z = 2
    $$
2.  **اللعب بالزوايا:**
    * لو قالك بيصنع زوايا متساوية $\\to$ يبقى $\\cos^2$ متساوية $\\to$ $3 \\cos^2 \\theta = 1$ $\\to$ $\\cos \\theta = \\pm \\frac{1}{\\sqrt{3}}$.
    * لو زاويتين مجموعهم 90 (مثلاً $\\theta_x + \\theta_y = 90$): يبقى التالتة ($\\theta_z$) لازم تكون **90** درجة.

---

# 4. العمليات على المتجهات (جبرياً وهندسياً) ➕➖

## أ) الجمع (قاعدة قفل المثلث):
* **هندسياً:** لو مشيت من $A$ لـ $B$، وبعدين من $B$ لـ $C$ ($\\vec{AB} + \\vec{BC}$)، المحصلة هي الطريق المختصر من البداية للنهاية ($\\vec{AC}$).
    $$\\vec{AB} + \\vec{BC} = \\vec{AC}$$
    *(الزتونة: لو الحرف اللي في النص زي بعضه، طيرهم وخد الأول والأخير).*

* **المضلع المغلق:** لو مشيت في دورة ورجعت لنفس النقطة ($\\vec{AB} + \\vec{BC} + \\vec{CA}$)، المحصلة = **المتجه الصفري** ($\\vec{0}$).

## ب) الطرح (عكس الاتجاه):
الطرح هو جمع المعكوس.
$$\\vec{A} - \\vec{B} = \\vec{A} + (-\\vec{B})$$
* قاعدة المتوسط: في المثلث $ABC$، لو $D$ منتصف $BC$:
    $$
    \\vec{AB} + \\vec{AC} = 2 \\vec{AD} \\quad (\\text{ضعف المتوسط})
    $$

**(يتبع في الرسالة القادمة: الضرب القياسي وسحر الفراغية...)**

title: الهندسة الفراغية (الجزء 3: الضرب القياسي وسحر الفراغية)
---

# 1. الضرب القياسي (Dot Product) - "النقطة" ⚫

ليه سموه "قياسي"؟ لأن الناتج بتاعه **رقم** (كمية قياسية) مش متجه.
بنرمزله بـ "نقطة" ($\\cdot$)، وبنقول "ألف دوت ب".

## أ) طريقتين للحساب (حسب المعطيات):

**1. لو معاك "معايير وزاوية" (الطريقة الهندسية):**
$$
\\underbrace{\\vec{A} \\cdot \\vec{B}}_{\\text{الضرب القياسي}} = ||\\vec{A}|| \\times ||\\vec{B}|| \\times \\cos \\theta
$$

$$
\\text{الضرب القياسي} = \\text{معيار الأول} \\times \\text{معيار الثاني} \\times \\text{جتا الزاوية بينهم}
$$

**2. لو معاك "إحداثيات/مركبات" (الطريقة الجبرية):**
لو $\\vec{A} = (x_1, y_1, z_1)$ و $\\vec{B} = (x_2, y_2, z_2)$:
$$
\\vec{A} \\cdot \\vec{B} = (x_1 x_2) + (y_1 y_2) + (z_1 z_2)
$$
*(اضرب السينات + اضرب الصادات + اضرب العينات).*

---

# 2. شرط الزاوية ($\\theta$) - "الفخ" ⚠️

عشان تطبق القانون الأول صح، لازم الزاوية تكون **بين اتجاهين خارجين** من نفس النقطة، أو **داخلين** لنفس النقطة.

* **الحالة السليمة:** السهمين طالعين من الرأس ($\\nearrow \\nwarrow$) أو داخلين للرأس ($\\searrow \\swarrow$). خد الزاوية زي ما هي.
* **الحالة الغلط:** واحد داخل وواحد خارج ($\\searrow \\nearrow$).
    * **الحل:** خد "المكملة" ($180 - \\theta$)، أو اضرب في سالب ($\\cos(180-\\theta) = -\\cos \\theta$).

> 💡 **مدى الزاوية:** الزاوية بين أي متجهين دايماً في الفترة $[0, 180]$. مفيش زاوية منعكسة في المتجهات.

---

# 3. خواص الضرب القياسي (قوانين اللعبة) 🛠️

1.  **الإبدال:** $\\vec{A} \\cdot \\vec{B} = \\vec{B} \\cdot \\vec{A}$. (الترتيب مش فارق).
2.  **التوزيع:** الضرب يتوزع على الجمع. $\\vec{A} \\cdot (\\vec{B} + \\vec{C}) = \\vec{A} \\cdot \\vec{B} + \\vec{A} \\cdot \\vec{C}$.
3.  **شرط التعامد (أهم خاصية):** 🛑
    لو المتجهين متعامدين ($\\theta = 90^\\circ$)، فإن:
    $$
    \\vec{A} \\cdot \\vec{B} = 0
    $$
    *(لأن $\\cos 90 = 0$). ده "كاشف التعامد" في الفراغية.*
4.  **متجهات الوحدة الأساسية:**
    * المختلفين بصفر (تعامد): $\\vec{i} \\cdot \\vec{j} = 0$.
    * المتشابهين بواحد: $\\vec{i} \\cdot \\vec{i} = 1 \\times 1 \\times \\cos 0 = 1$.

---

# 4. سحر الفراغية (المعيار تربيع) 🔥🪄

دي الخاصية اللي بتحل المسائل اللي "شكلها يخض".
**القاعدة:** أي متجه ينضرب قياسياً في نفسه = **معياره تربيع**.

$$
\\vec{A} \\cdot \\vec{A} = ||\\vec{A}||^2
$$

### 🔥 تطبيق سحري (فك القوس التربيع):
لو جالك سؤال عايز معيار جمع متجهين $||\\vec{A} + \\vec{B}||$ ومعاك معاييرهم بس.
* **الحل:** ربع المقدار وفكه زي القوس الجبري العادي:
$$
||\\vec{A} + \\vec{B}||^2 = (\\vec{A} + \\vec{B}) \\cdot (\\vec{A} + \\vec{B})
$$
$$
= \\underbrace{||\\vec{A}||^2}_{\\text{الأول تربيع}} + \\underbrace{||\\vec{B}||^2}_{\\text{الثاني تربيع}} + \\underbrace{2 (\\vec{A} \\cdot \\vec{B})}_{\\text{2 × الأول × الثاني}}
$$
*(خد بالك الحد الأوسط هنا هو 2 ضرب قياسي، يعني $2 ||A|| ||B|| \\cos \\theta$).*

---

# 5. المركبة والمسقط (Projection) 📐

فيه فرق في اللفظ بين "المركبة" و "المركبة الاتجاهية":

## أ) المركبة الجبرية (المسقط العمودي):
يعني طول ظل المتجه $\\vec{A}$ على المتجه $\\vec{B}$. (كمية قياسية).
$$
\\text{المركبة} = ||\\vec{A}|| \\cos \\theta = \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||}
$$
*(اضربهم قياسي واقسم على معيار اللي رايح عليه).*

## ب) المركبة الاتجاهية:
عايز الظل ده بس كـ "متجه".
$$
\\text{المركبة الاتجاهية} = (\\text{المركبة الجبرية}) \\times \\vec{U}_B
$$
$$
= \\left( \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||} \\right) \\times \\frac{\\vec{B}}{||\\vec{B}||} = \\left( \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||^2} \\right) \\vec{B}
$$

---

# الخلاصة (الجدول الذهبي - الفراغية الجزء 2) 🌟

| الحالة / المطلوب | القانون / التصرف | تريكة Wak |
| :--- | :--- | :--- |
| **ضرب قياسي (هندسي)** | $$||\\vec{A}|| ||\\vec{B}|| \\cos \\theta$$ | لازم السهمين **خارجين** أو **داخلين**. لو عكس بعض اضرب في سالب. |
| **ضرب قياسي (جبري)** | $$x_1 x_2 + y_1 y_2 + z_1 z_2$$ | جمع حواصل الضرب. |
| **شرط التعامد** | $$\\vec{A} \\cdot \\vec{B} = 0$$ | لو الضرب بصفر، يبقى متعامدين (أو أحدهما صفري). |
| **الزاوية بين متجهين** | $$\\cos \\theta = \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{A}|| ||\\vec{B}||}$$ | البسط هو الضرب القياسي، المقام ضرب المعايير. |
| **نوع الزاوية** | حسب إشارة الضرب القياسي | موجب $\\to$ حادة.<br>سالب $\\to$ منفرجة.<br>صفر $\\to$ قائمة. |
| **سحر المعيار** | $$||\\vec{A}||^2 = \\vec{A} \\cdot \\vec{A}$$ | استخدمها لفك $||\\vec{A} \\pm \\vec{B}||^2$. |
| **مركبة أ في اتجاه ب** | $$\\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||}$$ | اقسم على معيار "اللي رايح عليه". |

---

كدة معاك "دستور الفراغية" (من الإحداثيات لحد الضرب القياسي).

title: الهندسة الفراغية (الجزء 4: تطبيقات القياسي والضرب الاتجاهي)
---

# 1. تطبيقات الضرب القياسي (تكملة ما فات) 🔌

احنا وقفنا المرة اللي فاتت عند القانون، تعال نشوف بنستخدمه في إيه:

## أ) تحديد نوع المثلث (بالزوايا) 📐
بدل ما تجيب أطوال أضلاع وتربع (شغل إعدادي)، الضرب القياسي بيخلص:
* هات المتجهات الممثلة للأضلاع ($\\vec{AB}, \\vec{BC}, \\vec{CA}$).
* اضرب كل اتنين قياسياً:
    1.  لو الناتج **صفر** $\\to$ متعامدين $\\to$ **مثلث قائم**.
    2.  لو الناتج **سالب** $\\to$ الزاوية منفرجة $\\to$ **مثلث منفرج**.
    3.  لو النواتج كلها **موجبة** $\\to$ الزوايا حادة $\\to$ **مثلث حاد**.

## ب) الشغل المبذول ($Work$) 👷
تطبيق فيزياء صريح (ديناميكا):
$$
\\text{الشغل} (W) = \\vec{F} \\cdot \\vec{S} = ||\\vec{F}|| \\times ||\\vec{S}|| \\cos \\theta
$$
*(القوة قياسي الإزاحة)*.

---

# 2. المركبة الجبرية والاتجاهية (Projection) 🔦

دي أكتر حتة بتلخبط، ركز في المسميات:

## 1. المركبة الجبرية (أو "مسقط" المتجه)
ده **رقم** (طول الظل).
* **القانون:**
    $$
    \\text{مركبة } \\vec{A} \\text{ في اتجاه } \\vec{B} = ||\\vec{A}|| \\cos \\theta = \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||}
    $$
    *(الضرب القياسي على معيار "اللي رايح عليه")*.
* **الإشارة:** ممكن تكون موجبة (زاوية حادة) أو سالبة (زاوية منفرجة).

## 2. المركبة الاتجاهية (Vector Component)
ده **متجه** (الظل نفسه واتجاهه).
* **القانون:** بناخد "المركبة الجبرية" نضربها في "متجه الوحدة" بتاع اللي رايحين عليه.
    $$
    \\text{المركبة الاتجاهية} = \\left( \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||} \\right) \\times \\frac{\\vec{B}}{||\\vec{B}||} = \\left( \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||^2} \\right) \\vec{B}
    $$
    *(الضرب القياسي على "معيار التاني تربيع"، والناتج اضربه في المتجه التاني)*.

> 💡 **مثال:** مركبة $\\vec{A}$ في اتجاه $\\vec{B}$.
> * جبرية: $\\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||}$
> * اتجاهية: $\\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||^2} \\vec{B}$

---

# 3. الضرب الاتجاهي (Cross Product) ✖️

ده "الوحش" الجديد.
* **الرمز:** $\\vec{A} \\times \\vec{B}$ (بننطقها "ألف كروس ب").
* **الناتج:** **متجه** (مش رقم) عمودي على المستوى اللي بيحوي المتجهين.

## أ) القوانين (كيفية الحساب)

**1. بدلالة الزاوية (قانون الجا):**
$$
\\vec{A} \\times \\vec{B} = (||\\vec{A}|| \\cdot ||\\vec{B}|| \\sin \\theta) \\ \\hat{n}
$$
* $\\theta$: الزاوية بين المتجهين.
* $\\hat{n}$: متجه وحدة عمودي على المستوى (قاعدة اليد اليمنى).
* **هام:** لو عايز "المعيار" بس، شيل الـ $\\hat{n}$.

**2. بدلالة الإحداثيات (المحدد):**
لو في 3D، بنعمل "محدد ثلاثي":
$$
\\vec{A} \\times \\vec{B} = \\begin{vmatrix} \\vec{i} & \\vec{j} & \\vec{k} \\\\ A_x & A_y & A_z \\\\ B_x & B_y & B_z \\end{vmatrix}
$$
*(فك بموجب سالب موجب: خبي صف وعمود... إلخ)*.

**3. الحالة الخاصة (2D):**
لو المتجهات في المستوى (س، ص) بس (مثلاً $\\vec{A}=(x_1, y_1)$ و $\\vec{B}=(x_2, y_2)$).
* **القانون السريع (طرفين - وسطين):**
    $$
    \\vec{A} \\times \\vec{B} = (x_1 y_2 - x_2 y_1) \\vec{k}
    $$
    *(اللي بره في اللي بره ناقص اللي جوه في اللي جوه)*.

---

## ب) خواص الضرب الاتجاهي (احترس) ⚠️

1.  **ليس إبدالي:** الترتيب يفرق!
    $$
    \\vec{A} \\times \\vec{B} = - (\\vec{B} \\times \\vec{A})
    $$
    *(لو عكست، غير الإشارة)*.
2.  **شرط التوازي:** 🛑
    لو المتجهين متوازيين ($\\theta = 0$ أو $180$)، فإن:
    $$
    \\vec{A} \\times \\vec{B} = \\vec{0} \\quad (\\text{المتجه الصفري})
    $$
    *(قارن: القياسي بصفر يعني تعامد، الاتجاهي بصفر يعني توازي)*.
3.  **الضرب مع النفس:**
    $$
    \\vec{A} \\times \\vec{A} = \\vec{0}
    $$
4.  **متجهات الوحدة (دورة السعادة):** 🔄
    * $\\vec{i} \\times \\vec{j} = \\vec{k}$ (مع عقارب الساعة).
    * $\\vec{j} \\times \\vec{k} = \\vec{i}$
    * $\\vec{k} \\times \\vec{i} = \\vec{j}$
    * لو عكست (مثلاً $\\vec{j} \\times \\vec{i}$) $\\to$ $-\\vec{k}$.

**(يتبع في الرسالة القادمة: أهم استخدامات الاتجاهي + الضرب الثلاثي القياسي...)**

title: الهندسة الفراغية (الجزء 5: المساحات، الحجوم، والضرب الثلاثي)
---

# 1. استخدامات الضرب الاتجاهي (Applications) 🛠️

الضرب الاتجاهي مش مجرد قانون، ده "أداة هندسية" جبارة:

## أ) الكشف عن التوازي (Parallelism)
لو $\\vec{A} \\times \\vec{B} = \\vec{0}$ (المتجه الصفري)، يبقى المتجهين **متوازيين**.
* **تريكة:** لو متوازيين، يبقى المسقط الأول على الأول = التاني على التاني = التالت على التالت (التناسب).
    $$
    \\frac{x_1}{x_2} = \\frac{y_1}{y_2} = \\frac{z_1}{z_2} = \\text{ثابت}
    $$

## ب) متجه الوحدة العمودي (Normal Vector) ⊥
عشان تجيب متجه عمودي على مستوى بيحوي المتجهين $\\vec{A}$ و $\\vec{B}$:
1.  اضربهم اتجاهي ($\\vec{A} \\times \\vec{B}$). الناتج هو المتجه العمودي.
2.  لو عايزه "متجه وحدة" ($\\hat{n}$)، اقسم المتجه على معياره.
    $$
    \\hat{n} = \\pm \\frac{\\vec{A} \\times \\vec{B}}{||\\vec{A} \\times \\vec{B}||}
    $$
    *(موجب وسالب لأن العمودي ممكن يكون طالع لفوق أو نازل لتحت).*

## ج) حساب المساحات (Areas) 📐
دي أهم حتة في الامتحانات:

1.  **مساحة متوازي الأضلاع:**
    $$
    \\text{المساحة} = ||\\vec{A} \\times \\vec{B}||
    $$
    *(حيث $\\vec{A}, \\vec{B}$ هما ضلعين **متجاورين**).*

2.  **مساحة المثلث:**
    المثلث هو نص المتوازي، يبقى:
    $$
    \\text{المساحة} = \\frac{1}{2} ||\\vec{A} \\times \\vec{B}||
    $$
    *(حيث $\\vec{A}, \\vec{B}$ هما ضلعين في المثلث).*

3.  **مساحة أي شكل رباعي (بمعلومية الأقطار):**
    لو $\\vec{d_1}$ و $\\vec{d_2}$ هما قطرا الشكل:
    $$
    \\text{المساحة} = \\frac{1}{2} ||\\vec{d_1} \\times \\vec{d_2}||
    $$

---

# 2. الضرب الثلاثي القياسي (Scalar Triple Product) 📦

ده "الكوكتيل". عملية بتتم على 3 متجهات ($\\vec{A}, \\vec{B}, \\vec{C}$).
* **الشكل:** $\\vec{A} \\cdot (\\vec{B} \\times \\vec{C})$.
* **الناتج:** **رقم** (كمية قياسية).
* **الأولوية:** الضرب الاتجاهي الأول (عشان يطلع متجه)، وبعدين نضربه قياسي في الأول.

## أ) طريقة الحساب (المحدد الثلاثي):
بنرص المتجهات التلاتة تحت بعض في محدد:
$$
\\vec{A} \\cdot (\\vec{B} \\times \\vec{C}) = \\begin{vmatrix} A_x & A_y & A_z \\\\ B_x & B_y & B_z \\\\ C_x & C_y & C_z \\end{vmatrix}
$$

## ب) الخواص (لعبة الكراسي الموسيقية): 🔄
الترتيب الدوري بيحافظ على الإشارة:
$$
\\vec{A} \\cdot (\\vec{B} \\times \\vec{C}) = \\vec{B} \\cdot (\\vec{C} \\times \\vec{A}) = \\vec{C} \\cdot (\\vec{A} \\times \\vec{B})
$$
* لو بدلت مكان أي اتنين (كسرت الترتيب الدوري)، الناتج يغير إشارته (سالب).
* لو فيه متجهين متساويين في المحدد $\\to$ الناتج **صفر**.

---

# 3. تطبيقات الضرب الثلاثي (الحجوم) 🧊

## أ) حجم متوازي السطوح (Parallelepiped):
متوازي السطوح ده مجسم (زي مكعب مايل) أوجهه كلها متوازيات أضلاع.
* **الحجم** = القيمة المطلقة للضرب الثلاثي القياسي للأحرف المتجاورة.
    $$
    \\text{الحجم} = |\\vec{A} \\cdot (\\vec{B} \\times \\vec{C})|
    $$

## ب) شرط وقوع متجهات في مستوى واحد (Coplanar): 🛑
عشان 3 متجهات يقعوا في نفس المستوى، لازم "حجم" المتوازي اللي بينهم يكون **صفر** (لأنهم مفعوصين).
* **الشرط:**
    $$
    \\vec{A} \\cdot (\\vec{B} \\times \\vec{C}) = 0
    $$
    *(لو قيمة المحدد بصفر $\\to$ المتجهات في مستوى واحد).*

---

# الجدول الذهبي (ملخص الفراغية - الجزء الأخير) 🌟

| العملية / المطلوب | القانون / الأداة | تريكة Wak |
| :--- | :--- | :--- |
| **التوازي** | $$\\vec{A} \\times \\vec{B} = \\vec{0}$$ | أو استخدم التناسب: $\\frac{x}{x} = \\frac{y}{y} = \\frac{z}{z}$. |
| **العمودي على مستوى** | $$\\vec{A} \\times \\vec{B}$$ | الناتج هو متجه عمودي. لو عايز وحدة اقسم على المعيار. |
| **مساحة متوازي أضلاع** | $$||\\vec{A} \\times \\vec{B}||$$ | لازم $\\vec{A}, \\vec{B}$ يكونوا ضلعين **متجاورين** (خارجين من نفس النقطة). |
| **مساحة مثلث** | $$\\frac{1}{2} ||\\vec{A} \\times \\vec{B}||$$ | نص مساحة المتوازي. |
| **الضرب الثلاثي** | محدد (أ، ب، ج) | الناتج رقم (موجب أو سالب). |
| **حجم متوازي السطوح** | $$|\\text{المحدد}|$$ | خد المقياس عشان الحجم لازم موجب. |
| **في مستوى واحد؟** | $$\\text{المحدد} = 0$$ | لو الحجم بصفر، يبقى مفيش ارتفاع، يبقى كلهم على الأرض (مستوى واحد). |

---

**تم بحمد الله تفريغ وشرح منهج الهندسة الفراغية (الوحدة الأولى) بالكامل.**
كدة معاك (النظام الإحداثي، المتجهات، الضرب القياسي، الضرب الاتجاهي، الضرب الثلاثي).
أي خدمة تانية يا هندسة؟ أنا جاهز لأي ملف جديد! 🚀

title: الجدول الذهبي الشامل (1/5): النظام الإحداثي وقوانين البعد
---

# 1. أساسيات النظام ثلاثي الأبعاد (3D) 🌐

| العنصر | الوصف والمعادلة | ملاحظات وتريكات Wak |
| :--- | :--- | :--- |
| **النظام الإحداثي** | يتكون من 3 محاور متعامدة $(s, s, \\varepsilon)$ تتلاقى في نقطة الأصل $(0,0,0)$. | - الرسم على الورق هو نموذج محاكي (ليس حقيقياً).<br>- يتبع قاعدة اليد اليمنى. |
| **المحاور (Lines)** | **محور س:** $(x, 0, 0)$ معادلاته: $y=0, z=0$<br>**محور ص:** $(0, y, 0)$ معادلاته: $x=0, z=0$<br>**محور ع:** $(0, 0, z)$ معادلاته: $x=0, y=0$ | - أي نقطة على المحور لها إحداثي واحد والباقي أصفار.<br>- معادلة المحور تتطلب **صفرين**. |
| **المستويات (Planes)** | **المستوى (س ص):** $(x, y, 0)$ معادلته: $z=0$<br>**المستوى (س ع):** $(x, 0, z)$ معادلته: $y=0$<br>**المستوى (ص ع):** $(0, y, z)$ معادلته: $x=0$ | - معادلة المستوى هي **صفر المختلف** (الرمز الغائب).<br>- أي نقطة في المستوى لها إحداثيين والثالث صفر. |

---

# 2. قوانين البعد والمسافة (Distance) 📏

| الحالة | القانون المستخدم | التريكة (الزتونة) |
| :--- | :--- | :--- |
| **بعد نقطة عن نقطة الأصل** | $$\\sqrt{x^2 + y^2 + z^2}$$ | تطبيق مباشر لفيثاغورس في الفراغ. |
| **البعد بين نقطتين**<br>($A, B$) | $$\\sqrt{(x_2-x_1)^2 + (y_2-y_1)^2 + (z_2-z_1)^2}$$ | - الجذر التربيعي لمجموع مربعات فروق الإحداثيات.<br>- يستخدم لإثبات نوع المثلث (قائم، حاد، منفرج) أو الشكل الرباعي. |
| **بعد نقطة عن مستوى** | **عن (س ص):** $|z|$ (مقياس ع)<br>**عن (س ع):** $|y|$ (مقياس ص)<br>**عن (ص ع):** $|x|$ (مقياس س) | - لازم تاخد **المقياس** (القيمة المطلقة) لأن البعد دائماً موجب.<br>- خد الرمز **الناقص** في اسم المستوى. |
| **بعد نقطة عن محور** | **عن س:** $\\sqrt{y^2 + z^2}$<br>**عن ص:** $\\sqrt{x^2 + z^2}$<br>**عن ع:** $\\sqrt{x^2 + y^2}$ | - جذر مجموع مربعات **الرمزين الباقيين**.<br>- تخيلها كوتر في مثلث قائم. |

### ⚠️ تطبيقات قانون البعد (إثبات الأشكال)

| الشكل الهندسي | شرط الإثبات (باستخدام الأطوال) |
| :--- | :--- |
| **على استقامة واحدة** | مجموع أصغر ضلعين = الضلع الأكبر. ($AB + BC = AC$) |
| **مثلث قائم** | مربع أكبر ضلع = مجموع مربعي الضلعين الآخرين. ($AC^2 = AB^2 + BC^2$) |
| **مثلث منفرج** | مربع أكبر ضلع > مجموع مربعي الضلعين الآخرين. |
| **مثلث حاد** | مربع أكبر ضلع < مجموع مربعي الضلعين الآخرين. |
| **المربع** | أضلاع متساوية + أقطار متساوية. |
| **المعين** | أضلاع متساوية + أقطار **غير** متساوية. |
| **المستطيل** | كل ضلعين متقابلين متساويين + أقطار متساوية. |

title: الجدول الذهبي الشامل (2/5): المتجهات (الأساسيات، المعيار، والاتجاه)
---

# 3. المتجهات (Vectors) - اللغة الجديدة ↗️

| المفهوم | التعريف والقانون | ملاحظات وتريكات Wak |
| :--- | :--- | :--- |
| **المتجه (Vector)** | قطعة مستقيمة موجهة (لها مقدار واتجاه). | - يختلف عن النقطة (المكان). المتجه هو "أمر بالحركة". |
| **متجه الموضع**<br>(Position Vector) | - بدايته دائماً **نقطة الأصل** ($W$).<br>- يكتب بحرف واحد: $\\vec{A} = (x, y, z)$. | - مركباته هي نفسها إحداثيات النقطة $A$. |
| **متجه الإزاحة**<br>(Displacement) | - واصل بين نقطتين مختلفتين ($A \\to B$).<br>- **القانون:** $\\vec{AB} = \\vec{B} - \\vec{A}$ | - **النهاية ناقص البداية**.<br>- $\\vec{AB} = -\\vec{BA}$ (عكس الاتجاه يعني سالب). |
| **المتجه الصفري** | $\\vec{0} = (0, 0, 0)$ | - معياره صفر وليس له اتجاه محدد.<br>- هو المحايد الجمعي. |

---

# 4. المعيار (Norm/Magnitude) 📏

| الخاصية | القانون / الوصف | تريكات هامة ⚠️ |
| :--- | :--- | :--- |
| **قانون المعيار** | $$||\\vec{A}|| = \\sqrt{x^2 + y^2 + z^2}$$ | - هو "طول" القطعة المستقيمة.<br>- دائماً قيمة موجبة (أو صفر). |
| **خروج الأرقام** | $$||k \\vec{A}|| = |k| \\cdot ||\\vec{A}||$$ | - الرقم يخرج بره المعيار بـ **قيمة مطلقة** (مقياس).<br>- لو المجهول جوه المعيار، يطلع بمقياس (موجب وسالب). |
| **توزيع المعيار** | $$||\\vec{A} + \\vec{B}|| \\leq ||\\vec{A}|| + ||\\vec{B}||$$ | - **ممنوع** توزيع المعيار على الجمع.<br>- الحالة الوحيدة للتساوي: لو المتجهين **متوازيين وفي نفس الاتجاه**. |

---

# 5. متجه الوحدة وزوايا الاتجاه (The Direction) 🧭

| المصطلح | القانون / العلاقة | الزتونة (Wak) |
| :--- | :--- | :--- |
| **متجه الوحدة**<br>($\\vec{U}$) | $$\\vec{U} = \\frac{\\vec{A}}{||\\vec{A}||}$$ | - متجه طوله **واحد** وله نفس اتجاه المتجه الأصلي.<br>- يستخدم لتحويل "المعيار" إلى "متجه". |
| **زوايا الاتجاه**<br>$(\\theta_x, \\theta_y, \\theta_z)$ | هي الزوايا التي يصنعها المتجه مع الاتجاهات **الموجبة** للمحاور. | - كل زاوية تنتمي للفترة $[0, \\pi]$. |
| **جيوب التمام**<br>(Direction Cosines) | $$\\cos \\theta_x = \\frac{A_x}{||\\vec{A}||}, \\quad \\cos \\theta_y = \\frac{A_y}{||\\vec{A}||}, \\dots$$ | - **جيوب التمام هي نفسها مركبات متجه الوحدة**.<br>- $\\vec{U} = (\\cos \\theta_x, \\cos \\theta_y, \\cos \\theta_z)$. |
| **القانون السحري** | $$\\cos^2 \\theta_x + \\cos^2 \\theta_y + \\cos^2 \\theta_z = 1$$ | - مجموع مربعات جيوب التمام = 1.<br>- مجموع مربعات الجيوب ($\\sin^2$) = 2. |

### 🧠 تريكات الزوايا:
1.  **زوايا متساوية:** لو قالك يصنع زوايا متساوية مع المحاور $\\to$ $\\cos \\theta = \\pm \\frac{1}{\\sqrt{3}}$.
2.  **مجموع زاويتين 90:** لو $\\theta_x + \\theta_y = 90^\\circ$ $\\to$ الزاوية الثالثة $\\theta_z = 90^\\circ$ حتماً.
3.  **المستوى الإحداثي:** لو المتجه يقع في المستوى (س ص) $\\to$ يبقى عمودي على ع $\\to$ $\\theta_z = 90^\\circ$.

---

# 6. العمليات الجبرية على المتجهات ➕➖

| العملية | الطريقة | التفسير الهندسي |
| :--- | :--- | :--- |
| **الجمع** | $(x_1+x_2, \\ y_1+y_2, \\ z_1+z_2)$ | **قاعدة قفل المثلث:** $\\vec{AB} + \\vec{BC} = \\vec{AC}$.<br>(لو مشيت من أ لـ ب ثم لـ ج، كأنك مشيت من أ لـ ج). |
| **الطرح** | $\\vec{A} - \\vec{B} = \\vec{A} + (-\\vec{B})$ | **قاعدة المتوسط:** $\\vec{AB} + \\vec{AC} = 2\\vec{AD}$ (حيث D منتصف BC). |
| **التوازي** | $\\vec{A} \\parallel \\vec{B}$ | - أحدهما يساوي ثابت في الآخر: $\\vec{A} = k \\vec{B}$.<br>- التناسب: $\\frac{x_1}{x_2} = \\frac{y_1}{y_2} = \\frac{z_1}{z_2}$. |

title: الجدول الذهبي الشامل (3/5): الضرب القياسي وتطبيقاته (سحر الفراغية)
---

# 7. الضرب القياسي (Dot Product) - "النقطة" ⚫

| الحالة | القانون / الصيغة | تريكات Wak (الزتونة) |
| :--- | :--- | :--- |
| **التعريف (هندسياً)** | $$\\vec{A} \\cdot \\vec{B} = ||\\vec{A}|| \\cdot ||\\vec{B}|| \\cos \\theta$$ | - **شرط الزاوية:** لازم السهمين يكونوا **خارجين** من النقطة أو **داخلين** لها.<br>- لو واحد خارج وواحد داخل $\\to$ اضرب في **سالب** (أو خد المكملة). |
| **التعريف (جبرياً)** | $$\\vec{A} \\cdot \\vec{B} = x_1 x_2 + y_1 y_2 + z_1 z_2$$ | - اضرب السينات + اضرب الصادات + اضرب العينات.<br>- الناتج **رقم** (كمية قياسية) وليس متجهاً. |
| **شرط التعامد** ⊥ | $$\\vec{A} \\cdot \\vec{B} = 0$$ | - أهم خاصية: لو الضرب بصفر $\\to$ المتجهين متعامدين (أو أحدهما صفري). |
| **سحر المعيار** ✨ | $$\\vec{A} \\cdot \\vec{A} = ||\\vec{A}||^2$$ | - أي متجه في نفسه = معياره تربيع.<br>- تُستخدم لفك الأقواس: $||\\vec{A} + \\vec{B}||^2$. |
| **متجهات الوحدة** | $\\vec{i} \\cdot \\vec{i} = 1$<br>$\\vec{i} \\cdot \\vec{j} = 0$ | - المتشابهين بـ 1 (لأن الزاوية 0).<br>- المختلفين بـ 0 (لأن الزاوية 90). |

---

# 8. تطبيقات الضرب القياسي (استخدامات سحرية) 🛠️

| التطبيق | القانون / الكيفية | ملاحظات هامة ⚠️ |
| :--- | :--- | :--- |
| **إيجاد الزاوية**<br>بين متجهين | $$\\cos \\theta = \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{A}|| \\cdot ||\\vec{B}||}$$ | - البسط: ضرب قياسي.<br>- المقام: ضرب معايير.<br>- $\\theta \\in [0, 180^\\circ]$. |
| **نوع الزاوية** | حسب إشارة ($\\vec{A} \\cdot \\vec{B}$) | - **موجب** $\\to$ حادة ($0 < \\theta < 90$).<br>- **سالب** $\\to$ منفرجة ($90 < \\theta < 180$).<br>- **صفر** $\\to$ قائمة ($\\theta = 90$). |
| **الشغل المبذول**<br>(Work) | $$W = \\vec{F} \\cdot \\vec{S}$$ | - القوة (قياسي) الإزاحة.<br>- وحدة القياس: جول (لو نيوتن ومتر). |
| **المركبة الجبرية**<br>(المسقط) | $$\\text{مركبة } \\vec{A} \\text{ في اتجاه } \\vec{B} = \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||}$$ | - اضربهم قياسي واقسم على معيار **"اللي رايح عليه"**.<br>- الناتج **رقم** (موجب أو سالب). |
| **المركبة الاتجاهية**<br>(Vector Comp) | $$\\left( \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{B}||^2} \\right) \\vec{B}$$ | - اضرب المركبة الجبرية في متجه الوحدة ($\\vec{U}_B$).<br>- الناتج **متجه**. |

---

# 9. خواص العمليات على الضرب القياسي ⚙️

| الخاصية | الوصف | مثال |
| :--- | :--- | :--- |
| **الإبدال** | الترتيب لا يهم. | $\\vec{A} \\cdot \\vec{B} = \\vec{B} \\cdot \\vec{A}$ |
| **التوزيع** | يوزع على الجمع والطرح. | $\\vec{A} \\cdot (\\vec{B} + \\vec{C}) = \\vec{A} \\cdot \\vec{B} + \\vec{A} \\cdot \\vec{C}$ |
| **الضرب في عدد** | الرقم يخرج بره اللعبة. | $(k \\vec{A}) \\cdot \\vec{B} = k (\\vec{A} \\cdot \\vec{B})$ |
---
title: الجدول الذهبي الشامل (4/5): الضرب الاتجاهي وتطبيقاته (المساحات والعمودي)
---

# 10. الضرب الاتجاهي (Cross Product) - "الكروس" ✖️

| الحالة | القانون / الصيغة | تريكات Wak (الزتونة) |
| :--- | :--- | :--- |
| **التعريف (المعيار)** | $$||\\vec{A} \\times \\vec{B}|| = ||\\vec{A}|| \\cdot ||\\vec{B}|| \\sin \\theta$$ | - الناتج **متجه** عمودي على المستوى.<br>- الاتجاه يحدد بقاعدة اليد اليمنى. |
| **الصيغة الجبرية**<br>(في الفراغ 3D) | $$\\vec{A} \\times \\vec{B} = \\begin{vmatrix} \\vec{i} & \\vec{j} & \\vec{k} \\\\ A_x & A_y & A_z \\\\ B_x & B_y & B_z \\end{vmatrix}$$ | - فك المحدد بإشارات (موجب - سالب - موجب).<br>- الصف الأول دايماً متجهات الوحدة ($\\vec{i}, \\vec{j}, \\vec{k}$). |
| **الصيغة الجبرية**<br>(في المستوى 2D) | $$\\vec{A} \\times \\vec{B} = (x_1 y_2 - x_2 y_1) \\vec{k}$$ | - "طرفين ناقص وسطين" في اتجاه $\\vec{k}$.<br>- مفيدة جداً في العزوم (استاتيكا). |
| **شرط التوازي** ⏸️ | $$\\vec{A} \\times \\vec{B} = \\vec{0}$$ | - لو الضرب الاتجاهي بمتجه صفري $\\to$ متوازيين.<br>- (عكس القياسي اللي بيكشف عن التعامد). |
| **الضرب مع النفس** | $$\\vec{A} \\times \\vec{A} = \\vec{0}$$ | - أي متجه كروس نفسه بصفر (لأن الزاوية 0). |

---

# 11. خواص الضرب الاتجاهي (احترس من الإشارات) ⚠️

| الخاصية | الوصف | مثال |
| :--- | :--- | :--- |
| **غير إبدالي** | الترتيب يفرق في الإشارة. | $\\vec{A} \\times \\vec{B} = - (\\vec{B} \\times \\vec{A})$. |
| **التوزيع** | يوزع على الجمع (بترتيب ثابت). | $\\vec{A} \\times (\\vec{B} + \\vec{C}) = \\vec{A} \\times \\vec{B} + \\vec{A} \\times \\vec{C}$. |
| **متجهات الوحدة**<br>(دورة السعادة) | $\\vec{i} \\times \\vec{j} = \\vec{k}$<br>$\\vec{j} \\times \\vec{k} = \\vec{i}$<br>$\\vec{k} \\times \\vec{i} = \\vec{j}$ | - مع الدورة $\\to$ موجب.<br>- عكس الدورة ($\\vec{j} \\times \\vec{i}$) $\\to$ سالب ($-\\vec{k}$). |

---

# 12. تطبيقات الضرب الاتجاهي (المساحات والعمودي) 📐

| التطبيق | القانون / الكيفية | ملاحظات هامة |
| :--- | :--- | :--- |
| **مساحة متوازي الأضلاع** | $$\\text{المساحة} = ||\\vec{A} \\times \\vec{B}||$$ | - بشرط أن يكون $\\vec{A}, \\vec{B}$ ضلعين **متجاورين**.<br>- أو حاصل ضرب القطرين: $\\frac{1}{2} ||\\vec{d_1} \\times \\vec{d_2}||$. |
| **مساحة المثلث** | $$\\text{المساحة} = \\frac{1}{2} ||\\vec{A} \\times \\vec{B}||$$ | - نص معيار الضرب الاتجاهي لأي ضلعين. |
| **متجه وحدة عمودي**<br>على مستوى | $$\\hat{n} = \\pm \\frac{\\vec{A} \\times \\vec{B}}{||\\vec{A} \\times \\vec{B}||}$$ | - اضرب اتجاهي (عشان تجيب العمودي) واقسم على معياره (عشان تخليه وحدة).<br>- موجب وسالب (لأن العمودي له اتجاهين). |
| **إيجاد الزاوية**<br>(قانون الجا) | $$\\sin \\theta = \\frac{||\\vec{A} \\times \\vec{B}||}{||\\vec{A}|| \\cdot ||\\vec{B}||}$$ | - لا يفضل استخدامه لإيجاد الزاوية (لأن الجا موجبة في الربعين 1 و 2 فلا تحدد نوع الزاوية بدقة). |

title: الجدول الذهبي الشامل (5/5): الضرب الثلاثي القياسي والحجوم

# 13. الضرب الثلاثي القياسي (Scalar Triple Product) 📦

| العنصر | الوصف / القانون | تريكات Wak (الزتونة) |
| :--- | :--- | :--- |
| **التعريف** | $$\\vec{A} \\cdot (\\vec{B} \\times \\vec{C})$$ | - عملية تتم على **3 متجهات**.<br>- الناتج **رقم** (كمية قياسية) وليس متجهاً.<br>- لازم الاتجاهي (الكروس) يتم الأول، ثم القياسي. |
| **طريقة الحساب**<br>(المحدد الثلاثي) | $$\\begin{vmatrix} A_x & A_y & A_z \\\\ B_x & B_y & B_z \\\\ C_x & C_y & C_z \\end{vmatrix}$$ | - فك المحدد بإشاراته العادية.<br>- الصفوف هي مركبات المتجهات الثلاثة بالترتيب. |
| **الخواص**<br>(الكراسي الموسيقية) | $$\\vec{A} \\cdot (\\vec{B} \\times \\vec{C}) = \\vec{B} \\cdot (\\vec{C} \\times \\vec{A}) = \\vec{C} \\cdot (\\vec{A} \\times \\vec{B})$$ | - **الترتيب الدوري** يحافظ على الإشارة.<br>- تبديل أي متجهين يغير الإشارة (سالب).<br>- يمكن تبديل العلامتين ($\\cdot$ و $\\times$) دون تغيير القيمة: $\\vec{A} \\cdot (\\vec{B} \\times \\vec{C}) = (\\vec{A} \\times \\vec{B}) \\cdot \\vec{C}$. |
| **انعدام القيمة** | الناتج = صفر | - لو فيه أي **متجهين متساويين** (أو متوازيين) في المحدد.<br>- لو المتجهات الثلاثة في **مستوى واحد**. |

---

# 14. تطبيقات الضرب الثلاثي (الحجوم ومستويات) 🧊

| التطبيق | القانون / الصيغة | ملاحظات هامة |
| :--- | :--- | :--- |
| **حجم متوازي السطوح**<br>(Parallelepiped) | $$\\text{الحجم} = |\\vec{A} \\cdot (\\vec{B} \\times \\vec{C})|$$ | - بشرط أن تكون $\\vec{A}, \\vec{B}, \\vec{C}$ ثلاثة أحرف **متجاورة** (خارجة من نفس الرأس).<br>- لازم تاخد **المقياس** (القيمة المطلقة) لأن الحجم موجب. |
| **حجم الهرم الثلاثي**<br>(Tetrahedron) | $$\\text{الحجم} = \\frac{1}{6} |\\vec{A} \\cdot (\\vec{B} \\times \\vec{C})|$$ | - الهرم هو سدس حجم المتوازي المشترك معه في الأحرف. |
| **ارتفاع المتوازي** | $$\\text{الارتفاع} = \\frac{\\text{الحجم}}{\\text{مساحة القاعدة}}$$ | - الحجم: (مقياس الضرب الثلاثي).<br>- مساحة القاعدة: (معيار الضرب الاتجاهي لضلعي القاعدة). |
| **شرط المستوى الواحد**<br>(Coplanar Vectors) | $$\\vec{A} \\cdot (\\vec{B} \\times \\vec{C}) = 0$$ | - لو حجم المتوازي بصفر $\\to$ معناه مفيش ارتفاع $\\to$ المتجهات الثلاثة "مفعوصة" في نفس المستوى. |
| **شرط النقاط في مستوى واحد** | $\\vec{AB} \\cdot (\\vec{AC} \\times \\vec{AD}) = 0$ | - لو عندك 4 نقط ($A, B, C, D$)، كوّن 3 متجهات خارجة من نقطة واحدة واضربهم ثلاثي. لو صفر يبقوا في مستوى واحد. |

# 🏁 ختام الفراغية (نصائح Wak النهائية)

1.  **الرسم:** في الفراغية، الرسم "كروكي" بيحل نص المشكلة. ارسم متوازي أو مثلث وحط عليه المتجهات عشان تعرف مين خارج ومين داخل.
2.  **الترتيب:** في الضرب الاتجاهي (الكروس)، الترتيب حياة أو موت. $\\vec{A} \\times \\vec{B} \\neq \\vec{B} \\times \\vec{A}$.
3.  **المقياس:** أي "بعد" أو "طول" أو "حجم" لازم يكون موجب. لو طلعلك سالب في الحسابات، الزقه في مقياس فوراً.
4.  **الأدوات:**
    * عايز زاوية؟ $\\to$ **ضرب قياسي**.
    * عايز تعامد؟ $\\to$ **ضرب قياسي = 0**.
    * عايز توازي؟ $\\to$ **ضرب اتجاهي = 0** (أو تناسب).
    * عايز مساحة؟ $\\to$ **ضرب اتجاهي** (معيار).
    * عايز حجم؟ $\\to$ **ضرب ثلاثي** (محدد).
